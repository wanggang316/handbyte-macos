name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    # Hosted runners have no Xcode 27; Xcode 26.x builds a tools-version 6.2 package.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check rule ids against the Go CLI
        run: make sync-check

      - name: Test release scripts
        run: make test-scripts

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build package
        run: make build

      - name: Test package
        run: make test

      - name: Generate Xcode project
        run: make generate

      - name: Build app (unsigned)
        run: make app
