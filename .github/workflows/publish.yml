# After a Handbyte release (tag vX.Y.Z) is published: copy its appcast.xml to
# docs/ on main of wanggang316/handbyte, which GitHub Pages serves at
# https://handbyte.gumpw.com/appcast.xml as the Sparkle feed and the landing
# page reads for the download button, then update the Homebrew cask in
# wanggang316/homebrew-tap.
#
# Called by release-merge.yml after publication, or by `release: published`
# for manual releases. The feed and cask must reference a public stable release.
#
# Repository secret:
#   PUBLISH_TOKEN  Fine-grained PAT with Contents: read and write on
#                  wanggang316/handbyte and wanggang316/homebrew-tap.
name: publish

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release to publish again (vX.Y.Z)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::tag '$TAG' is not a release tag; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$INPUT_TAG" && "$IS_PRERELEASE" == "true" ]]; then
            echo "::notice::prerelease; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "skip=false"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Check secrets
        if: steps.meta.outputs.skip != 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::secret PUBLISH_TOKEN is not set (see the header of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.meta.outputs.skip != 'true'

      - name: Download release assets
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          STATE=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | any')
          if [[ "$STATE" != "false" ]]; then
            echo "::error::Distribution requires a published stable release"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets" \
            --pattern appcast.xml --pattern "Handbyte-$VERSION.dmg" --pattern "Handbyte-$VERSION.dmg.sha256"
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 -c "Handbyte-$VERSION.dmg.sha256"
          grep -q "releases/download/$TAG/Handbyte-$VERSION.dmg" appcast.xml \
            || { echo "::error::appcast.xml does not point at this release"; exit 1; }

      - name: Publish appcast to the website repository
        if: steps.meta.outputs.skip != 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          SITE_DIR="$RUNNER_TEMP/site"
          git clone --depth 1 --branch main "https://x-access-token:${PUBLISH_TOKEN}@github.com/wanggang316/handbyte.git" "$SITE_DIR"
          cp "$RUNNER_TEMP/assets/appcast.xml" "$SITE_DIR/docs/appcast.xml"
          cd "$SITE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff` alone does not see a new, untracked file.
          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "::notice::docs/appcast.xml already up to date"
            exit 0
          fi
          git commit -m "Publish the appcast for Handbyte $VERSION"
          git push origin HEAD:main

      - name: Update Homebrew cask
        if: steps.meta.outputs.skip != 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          SHA256="$(awk '{print $1}' "$RUNNER_TEMP/assets/Handbyte-$VERSION.dmg.sha256")"
          scripts/render-cask.sh "$VERSION" "$SHA256" "$RUNNER_TEMP/handbyte.rb"
          TAP_DIR="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:${PUBLISH_TOKEN}@github.com/wanggang316/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          cp "$RUNNER_TEMP/handbyte.rb" "$TAP_DIR/Casks/handbyte.rb"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/handbyte.rb
          if git diff --cached --quiet; then
            echo "::notice::cask already at $VERSION"
            exit 0
          fi
          git commit -m "handbyte $VERSION"
          git push origin HEAD
